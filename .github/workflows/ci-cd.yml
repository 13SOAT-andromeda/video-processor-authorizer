name: CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ci:
    if: github.event_name == 'pull_request'
    uses: 13SOAT-andromeda/tech-andromeda-ci-config/.github/workflows/reusable-go-ci.yml@v1
    secrets: inherit

  cd:
    needs: ci
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    uses: 13SOAT-andromeda/tech-andromeda-ci-config/.github/workflows/reusable-lambda-cd.yml@v1
    with:
      ecr-repository: video-processor-authorizer-prod
      platform: linux/arm64
      terraform-dir: terraform/prod
      terraform-run-tests: false
    secrets: inherit
